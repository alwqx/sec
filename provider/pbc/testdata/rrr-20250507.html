<html><head><meta charset="utf-8"><meta name="PubDate" content="2025-05-07"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">中国人民银行决定下调金融机构存款准备金率</h2><table><tr><td class="hui12" align="right">
             <!--2025年05月07日-->2025-05-07 10:00:00</td></tr></table><div id="zoom" class="zoom1">
              <p>为落实中央经济工作会议精神和《政府工作报告》部署，实施适度宽松的货币政策，提高宏观调控的前瞻性、针对性、有效性，中国人民银行决定，自2025年5月15日起，下调金融机构存款准备金率0.5个百分点（不含已执行5%存款准备金率的金融机构），下调汽车金融公司和金融租赁公司存款准备金率5个百分点。</p>
