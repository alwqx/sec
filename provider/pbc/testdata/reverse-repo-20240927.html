<html><head><meta charset="utf-8"><meta name="PubDate" content="2024-09-27"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">公开市场业务公告 ［2024］第5号</h2><span id="shijian">2024-09-27 08:00:00</span><div id="zoom" class="zoom1">
              <p>各公开市场业务一级交易商：</p>
              <p>为加大货币政策逆周期调节力度，支持经济稳定增长，从9月27日起，公开市场7天期逆回购操作利率由此前的1.70%调整为1.50%。公开市场14天期逆回购和临时正、逆回购的操作利率继续在公开市场7天期逆回购操作利率上加减点确定，加减点幅度保持不变。</p>
              <p>特此通知。</p>
              <p style="text-align: center;"></p>
              <p style="text-align: center;">中国人民银行公开市场业务操作室</p>
              <p style="text-align: center;">二〇二四年九月二十七日</p>
             </div></body></html>
