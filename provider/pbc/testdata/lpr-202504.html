<html><head><meta charset="utf-8"><meta name="PubDate" content="2025-04-21"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">2025年4月21日全国银行间同业拆借中心受权公布贷款市场报价利率（LPR）公告</h2><span id="shijian">2025-04-21 09:00:00</span><div id="zoom" class="zoom1">
              <p>中国人民银行授权全国银行间同业拆借中心公布，2025年4月21日贷款市场报价利率（LPR）为：1年期LPR为3.1%，5年期以上LPR为3.6%。以上LPR在下一次发布LPR之前有效。</p>
             </div></body></html>
