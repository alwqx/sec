<html><head><meta charset="utf-8"><meta name="PubDate" content="2024-09-27"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">中国人民银行决定下调金融机构存款准备金率</h2><table><tr><td class="hui12" align="right">
             <!--2024年09月27日-->2024-09-27 08:00:00</td></tr></table><div id="zoom" class="zoom1">
              <p>中国人民银行坚持支持性的货币政策立场，加大货币政策调控强度，提高货币政策调控精准性，为中国经济稳定增长和高质量发展创造良好的货币金融环境。中国人民银行决定：自2024年9月27日起，下调金融机构存款准备金率0.5个百分点（不含已执行5%存款准备金率的金融机构）。本次下调后，金融机构加权平均存款准备金率约为6.6%。</p>
