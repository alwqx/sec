<html><head><meta charset="utf-8"><meta name="PubDate" content="2026-06-17"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">中国人民银行公开市场业务公告［2026］第2号</h2><span id="shijian">2026-06-17 10:53:00</span><div id="zoom" class="zoom1">
              <p style="text-indent: 0px;">各公开市场业务一级交易商：</p>
              <p><span style="text-indent:0px;">为灵活高效运用公开市场临时隔夜正、逆回购工具，中国人民银行决定即日起优化操作要素，将操作时间调整为工作日15:00-15:30，操作利率分别调整为公开市场7天期逆回购操作利率减点25bp和加点25bp。进一步明确工具使用规则，在货币市场隔夜利率（DR001）持续低于或高于相应工具操作利率时，中国人民银行将结合一级交易商需求启动相应操作。</span></p>
              <p>特此通知。</p>
              <p></p>
              <p align="center">中国人民银行公开市场业务操作室</p>
              <p align="center">二〇二六年六月十七日</p>
             </div></body></html>
