<html><head><meta charset="utf-8"><meta name="PubDate" content="2020-01-01"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">中国人民银行决定于2020年1月6日下调金融机构存款准备金率</h2><table><tr><td class="hui12" align="right">
             <!--2020年01月01日-->2020-01-01 15:07:56</td></tr></table><div id="zoom" class="zoom1">
              <p>为支持实体经济发展，降低社会融资实际成本，中国人民银行决定于2020年1月6日下调金融机构存款准备金率0.5个百分点（不含财务公司、金融租赁公司和汽车金融公司）。</p>
              <p>中国人民银行将继续实施稳健的货币政策，保持灵活适度，不搞大水漫灌，兼顾内外平衡，保持流动性合理充裕，货币信贷、社会融资规模增长同经济发展相适应，激发市场主体活力，为高质量发展和供给侧结构性改革营造适宜的货币金融环境。（完）</p>
             </div></body></html>
