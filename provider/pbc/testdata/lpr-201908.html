<html><head><meta charset="utf-8"><meta name="PubDate" content="2019-08-20"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">2019年8月20日全国银行间同业拆借中心受权公布贷款市场报价利率（LPR）公告</h2><span id="shijian">2019-08-20 09:30:00</span><div id="zoom" class="zoom1">
              <p>中国人民银行授权全国银行间同业拆借中心公布，2019年8月20日贷款市场报价利率（LPR）为：1年期LPR为4.25%，5年期以上LPR为4.85%。以上LPR在下一次发布LPR之前有效。</p>
             </div></body></html>
