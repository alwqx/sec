<html><head><meta charset="utf-8"><meta name="PubDate" content="2025-05-07"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">中国人民银行公开市场业务公告［2025］第1号</h2><span id="shijian">2025-05-07 09:25:30</span><div id="zoom" class="zoom1">
              <p>为实施好适度宽松的货币政策，加力支持实体经济，从2025年5月8日起，公开市场7天期逆回购操作利率由此前的1.50%调整为1.40%。公开市场14天期逆回购和临时正、逆回购的操作利率继续在公开市场7天期逆回购操作利率上加减点确定，加减点幅度保持不变。</p>
              <p style="text-align: center;"></p>
              <p style="text-align: center;">中国人民银行公开市场业务操作室</p>
              <p style="text-align: center;">二〇二五年五月七日</p>
             </div></body></html>
