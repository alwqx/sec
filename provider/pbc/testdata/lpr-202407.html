<html><head><meta charset="utf-8"><meta name="PubDate" content="2024-07-22"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">2024年7月22日全国银行间同业拆借中心受权公布贷款市场报价利率（LPR）及调整发布时间公告</h2><span id="shijian">2024-07-22 09:00:00</span><div id="zoom" class="zoom1">
              <div>
               　　一、中国人民银行授权全国银行间同业拆借中心公布，2024年7月22日贷款市场报价利率（LPR）为：1年期LPR为3.35%，5年期以上LPR为3.85%。以上LPR在下一次发布LPR之前有效。
              </div></body></html>
