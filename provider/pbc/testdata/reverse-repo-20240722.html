<html><head><meta charset="utf-8"><meta name="PubDate" content="2024-07-22"></head><body><a href="/original">原文</a><h2 style="font-size: 16px;color: #333;">公开市场业务公告 ［2024］第4号</h2><span id="shijian">2024-07-22 08:00:00</span><div id="zoom" class="zoom1">
              <p>各公开市场业务一级交易商：</p>
              <p>为优化公开市场操作机制，从即日起，公开市场7天期逆回购操作调整为固定利率、数量招标。同时，为进一步加强逆周期调节，加大金融支持实体经济力度，即日起，公开市场7天期逆回购操作利率由此前的1.80%调整为1.70%。</p>
              <p>特此通知。</p>
              <p style="text-align: center;">中国人民银行公开市场业务操作室</p>
              <p style="text-align: center;">二〇二四年七月二十二日</p>
             </div></body></html>
