name: Sec CI
permissions:
  contents: read
  pull-requests: read
on: push
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Go Env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
        id: go

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # desktop 包只在 windows 和 darwin 上编译，Linux 上的 go test ./... 不会检查它。
  desktop:
    name: Desktop
    runs-on: macos-15
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Go Env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Build frontend
        working-directory: desktop/ui
        run: npm ci && npm run build

      - name: Test frontend
        working-directory: desktop/ui
        run: npm test

      - name: Vet
        run: go vet ./desktop

      - name: Test
        run: go test -v ./desktop

      # Linux 上的检查不包含 desktop 包。
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./desktop
