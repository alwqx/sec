name: Sec CI
permissions:
  contents: read
  pull-requests: read
on: push
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Go Env
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
        id: go

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # desktop 包除 webview 入口 main.go 外都在 Linux 上编译，Go 部分由上面的 go vet/test ./... 覆盖；
  # 这里只构建和测试前端。webview 入口的 macOS 编译见 desktop-macos.yml，不阻塞 PR。
  desktop-ui:
    name: Desktop UI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Build frontend
        working-directory: desktop/ui
        run: npm ci && npm run build

      - name: Test frontend
        working-directory: desktop/ui
        run: npm test
