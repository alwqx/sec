name: build-go-binary

permissions:
  contents: write
  pull-requests: write

on:
  release:
    types: [created] # 表示在创建新的 Release 时触发

jobs:
  build-go-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin] # 需要打包的系统
        goarch: [amd64, arm64] # 需要打包的架构
        exclude: # 排除某些平台和架构
          - goarch: arm64
            goos: windows
    steps:
      - uses: actions/checkout@v6

      - name: Set SEC_VERSION env
        run: echo SEC_VERSION=$(git describe --tags --always) >> ${GITHUB_ENV}
      - name: Set SEC_SHORT_SHA env
        run: echo SEC_SHORT_SHA=$(git rev-parse --short HEAD) >> ${GITHUB_ENV}
      - name: Set SEC_BUILD_TIME env
        run: echo SEC_BUILD_TIME=$(git log -s --format=%cd --date=format:%Y%m%d HEAD -1) >> ${GITHUB_ENV}
      - name: Environment Printer
        uses: managedkaos/print-env@v1.0

      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # 一个默认的变量，用来实现往 Release 中添加文件
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: 1.25 # 可以指定编译使用的 Golang 版本
          binary_name: "sec" # 可以指定二进制文件的名称
          extra_files: README.md # 需要包含的额外文件
          project_path: "./"
          build_flags: -v
          ldflags: -X "github.com/alwqx/sec/version.Version=${{ env.SEC_VERSION }}" -X "github.com/alwqx/sec/version.BuildTime=${{ env.SEC_BUILD_TIME }}" -X github.com/alwqx/sec/version.GitCommit=${{ env.SEC_SHORT_SHA }}

  # macOS 桌面版：构建前端 → 编译桌面二进制 → 封装 .app → 打包 .dmg 上传。
  # 当前只在 macos-latest（Apple Silicon，arm64）上构建；Intel/通用二进制留待后续。
  build-macos-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json

      - name: Build frontend
        working-directory: desktop/ui
        run: npm ci && npm run build

      - name: Set build metadata
        run: |
          {
            echo "SEC_VERSION=$(git describe --tags --always)"
            echo "SEC_SHORT_SHA=$(git rev-parse --short HEAD)"
            echo "SEC_BUILD_TIME=$(git log -1 --format=%cd --date=format:%Y%m%d)"
          } >> "$GITHUB_ENV"

      - name: Build desktop binary
        run: |
          CGO_ENABLED=1 go build -o sec-desktop \
            -ldflags '-X "github.com/alwqx/sec/version.Version=${{ env.SEC_VERSION }}" -X "github.com/alwqx/sec/version.BuildTime=${{ env.SEC_BUILD_TIME }}" -X "github.com/alwqx/sec/version.GitCommit=${{ env.SEC_SHORT_SHA }}"' \
            ./desktop

      - name: Package macOS app (.app → .dmg)
        run: |
          set -euo pipefail

          # 架构归一化：macos-latest 为 arm64，未来若支持 Intel 则映射为 amd64。
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            arm64)  ARCH="arm64" ;;
          esac

          APP_BUNDLE="sec.app"
          DMG_NAME="sec-desktop-darwin-${ARCH}"

          # 组装带应用图标的 .app bundle，并写入版本号。
          VERSION="$(git describe --tags --always | sed 's/^v//')"
          bash desktop/package-macos.sh sec-desktop "${APP_BUNDLE}" "${VERSION}"

          # 打包成 .dmg：内含 sec.app 与指向 /Applications 的软链。
          STAGING="$(mktemp -d)"
          cp -R "${APP_BUNDLE}" "${STAGING}/"
          ln -s /Applications "${STAGING}/Applications"
          hdiutil create -volname "sec" -srcfolder "${STAGING}" -ov -format UDZO "${DMG_NAME}.dmg"

          # 校验实际发布的镜像及其中应用的签名，避免只校验打包前的目录。
          hdiutil verify "${DMG_NAME}.dmg"
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_DIR" || true' EXIT
          hdiutil attach "${DMG_NAME}.dmg" -mountpoint "$MOUNT_DIR" -readonly -nobrowse
          codesign --verify --deep --strict --verbose=2 "${MOUNT_DIR}/sec.app"
          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${DMG_NAME}.dmg" --clobber
